[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mspipe"
version = "0.1.0"
description = "Multispectral imagery pipeline: grid alignment, block by block vegetation and water indices, classes, change between dates, management zones and an HTML report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jordan McKenzie" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "rasterio>=1.3", "pyproj>=3.5", "shapely>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mspipe = "mspipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
